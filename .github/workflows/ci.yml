name: Platform checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create environment and install
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Prepare fixed-layout converter
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup-document-converter.ps1
          "DOCUMENT_CONVERTER=$pwd/.runtime/libreoffice/program/soffice.exe" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: data/models
          key: multilingual-minilm-e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      - name: Prepare actual local embeddings
        run: .venv/Scripts/python.exe scripts/download_embedding.py
      - name: Backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH='backend'
          .venv/Scripts/python.exe -m pytest -q
      - name: Check generated contract
        shell: pwsh
        run: |
          .venv/Scripts/python.exe scripts/export_openapi.py
          npm --prefix frontend run api:types
          git diff --exit-code -- docs/openapi.json frontend/src/generated/api.d.ts
      - name: Frontend build
        run: npm --prefix frontend run build
      - name: Browser tests
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_CHANNEL='msedge'
          npm --prefix frontend run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run test:api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
